name: Track Octopus tariffs

on:
  schedule:
    # 07:11 UTC daily — offset from the :00/:15/:30/:45 boundary, which
    # is GitHub's documented highest-load window for scheduled runs
    # (ticks can be delayed or dropped there, never queued/retried).
    - cron: '11 7 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated CSV back to the repo

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Pull today's rates
        env:
          OCTOPUS_POSTCODE: ${{ secrets.OCTOPUS_POSTCODE }}
        run: python octopus_tariff_tracker.py

      - name: Commit and push if the CSV changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add octopus_tariff_history.csv
          git diff --staged --quiet || git commit -m "Add $(date -u +%F) tariff rates"
          git push
